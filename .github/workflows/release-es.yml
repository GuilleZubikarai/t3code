# Fork-only: builds the Spanish desktop app from the `spanish` branch and
# publishes it as a GitHub Release of this fork. The version matches the
# official release it is based on, so the desktop updater (which reads this
# fork's releases) moves users forward whenever upstream ships.
name: Release (español)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version to publish, e.g. 0.0.40"
        required: true
        type: string
      replace:
        description: "Replace an existing release with the same version"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: release-es
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        name: Validate version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPLACE: ${{ inputs.replace }}
        run: |
          version="${VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$REPLACE" != "true" ]]; then
              echo "Release v$version already exists. Re-run with replace=true to overwrite it." >&2
              exit 1
            fi
            gh release delete "v$version" -R "$GITHUB_REPOSITORY" --yes
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Typecheck web
        run: vp run --filter @t3tools/web typecheck

      - name: Test translations
        run: vp test run apps/web/src/i18n

  build:
    name: Build ${{ matrix.label }}
    needs: [preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS x64
            runner: macos-15
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: ./.github/actions/setup-apt-mirrors
        if: matrix.platform == 'linux'

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # macOS: signs with the Developer ID certificate stored in CSC_LINK so the
      # desktop updater (Squirrel.Mac) can install updates. Notarizes too when
      # APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER are configured.
      - name: Build desktop artifact
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [[ "${{ matrix.platform }}" == "mac" && -n "$CSC_LINK" ]]; then
            export T3CODE_DESKTOP_KEEP_CSC=1
            echo "macOS signing enabled (CSC_LINK)."
          fi
          if [[ -n "$APPLE_API_KEY" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            echo "macOS notarization enabled."
          fi
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.dmg release/*.zip release/*.AppImage release/*.blockmap release/*.yml; do
            [[ "$(basename "$file")" == "builder-debug.yml" ]] && continue
            cp "$file" release-publish/
          done
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi
          ls -la release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Merge macOS updater manifests
        run: |
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done
          ls -la release-assets

      # The fork inherits upstream's tags, which point at commits without the
      # translation. Move the tag to the commit that was actually built.
      - name: Point tag at built commit
        run: |
          git tag -f "${{ needs.preflight.outputs.tag }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/${{ needs.preflight.outputs.tag }}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: T3 Code ${{ needs.preflight.outputs.tag }} (español)
          body: |
            Build en español de T3 Code ${{ needs.preflight.outputs.tag }}.

            Mismo código que la versión oficial [pingdotgg/t3code ${{ needs.preflight.outputs.tag }}](https://github.com/pingdotgg/t3code/releases/tag/${{ needs.preflight.outputs.tag }}) más la traducción al español (Ajustes → General → Idioma). Sin firma de código: en macOS hay que permitir la app en Privacidad y seguridad la primera vez.
          prerelease: false
          make_latest: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}
