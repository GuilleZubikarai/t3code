# Fork-only: keeps the `spanish` branch rebased on the official T3 Code and
# publishes a Spanish build whenever the official project ships a new stable
# version. Conflicts are never resolved automatically; they open an issue.
name: Sync upstream (fork)

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/pingdotgg/t3code.git
  FORK_BRANCH: spanish
  # gh defaults to a fork's parent repository; pin every gh call to this fork.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream main --tags --quiet

      - name: Mirror upstream main
        run: git push origin upstream/main:refs/heads/main

      - id: rebase
        name: Rebase onto upstream
        run: |
          set +e
          git rebase upstream/main
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort -u)"
            git rebase --abort
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF_FILES"
              echo "$conflicts"
              echo "EOF_FILES"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflicted=false" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Report conflict
        if: steps.rebase.outputs.conflicted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.rebase.outputs.files }}
        run: |
          title="Conflicto al sincronizar con upstream"
          body="$(printf 'El rebase de `%s` sobre `pingdotgg/t3code@main` tiene conflictos en:\n\n```\n%s\n```\n\nResuélvelos a mano:\n\n```bash\ngit fetch upstream main\ngit checkout %s\ngit rebase upstream/main\n# resolver, git add, git rebase --continue\ngit push --force-with-lease origin %s\n```\n\nRun: %s/%s/actions/runs/%s' "$FORK_BRANCH" "$FILES" "$FORK_BRANCH" "$FORK_BRANCH" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          existing="$(gh issue list --label sync-conflict --state open --json number -q '.[0].number')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create sync-conflict --color B60205 --description "Rebase sobre upstream con conflictos" --force
            gh issue create --title "$title" --label sync-conflict --body "$body" \
              || gh issue create --title "$title" --body "$body"
          fi
          echo "::error::Rebase conflicts; see the sync-conflict issue."
          exit 1

      - name: Push rebased branch
        run: git push --force-with-lease origin "$FORK_BRANCH"

      - name: Close stale conflict issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label sync-conflict --state open --json number -q '.[].number'); do
            gh issue close "$number" --comment "El rebase volvió a aplicarse sin conflictos."
          done

      - id: release_check
        name: Check for a new upstream stable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' upstream/main 2>/dev/null || true)"
          if [[ -z "$tag" ]]; then
            echo "No stable upstream tag reachable from main."
            exit 0
          fi
          echo "Latest upstream stable: $tag"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Spanish release $tag already published."
            exit 0
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Publish Spanish release
        if: steps.release_check.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-es.yml --ref "$FORK_BRANCH" -f version="${{ steps.release_check.outputs.version }}"
